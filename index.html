<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Rosa</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #ffe6f0;
    }
    .calculator {
      background: #ffb6c1;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
      width: 320px;
    }
    #display {
      width: 100%;
      height: 60px;
      background: #fff0f5;
      border: 2px solid #ff69b4;
      border-radius: 16px;
      font-size: 2rem;
      text-align: right;
      padding: 0 16px;
      color: #d63384;
      outline: none;
      margin-bottom: 20px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      height: 55px;
      border: none;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      background: #ffffff;
      color: #ff69b4;
      transition: all 0.15s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    button:hover {
      background: #fff0f5;
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    button.op {
      background: #ff69b4;
      color: #ffffff;
    }
    button.op:hover {
      background: #ff1493;
    }
    button.clear {
      background: #ff8da1;
      color: #ffffff;
    }
    button.clear:hover {
      background: #e0607e;
    }
    button.equal {
      background: #ff1493;
      color: #ffffff;
      grid-column: span 2;
    }
    button.equal:hover {
      background: #c71585;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="clear" onclick="deleteLast()">DEL</button>
      <button class="op" onclick="appendChar('/')">÷</button>
      <button class="op" onclick="appendChar('*')">×</button>

      <button onclick="appendChar('7')">7</button>
      <button onclick="appendChar('8')">8</button>
      <button onclick="appendChar('9')">9</button>
      <button class="op" onclick="appendChar('-')">-</button>

      <button onclick="appendChar('4')">4</button>
      <button onclick="appendChar('5')">5</button>
      <button onclick="appendChar('6')">6</button>
      <button class="op" onclick="appendChar('+')">+</button>

      <button onclick="appendChar('1')">1</button>
      <button onclick="appendChar('2')">2</button>
      <button onclick="appendChar('3')">3</button>
      <button onclick="appendChar('.')">.</button>

      <button onclick="appendChar('0')">0</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendChar(val) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length === 1 || display.value === 'Error') {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        // Evalúa la expresión matemática
        display.value = eval(display.value.replace(/×/g, '*').replace(/÷/g, '/'));
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
